<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AM PRO — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root {
      --bg:#000; --surface:rgba(255,255,255,.05); --stroke:rgba(255,255,255,.08);
      --blue:#007aff; --red:#ff453a; --green:#30d158;
      --text:#f5f5f7; --dim:#86868b;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body {
      font-family:'Tajawal',sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      -webkit-font-smoothing:antialiased;
    }
    body::before {
      content:""; position:fixed; inset:0; z-index:-1;
      background:radial-gradient(ellipse at 50% -10%, #0a0a30 0%, #000 60%);
    }
    body::after {
      content:""; position:fixed; inset:0; z-index:-1;
      background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
                       linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
      background-size:48px 48px;
    }
    .card {
      width:100%; max-width:400px; padding:20px;
      animation:up .45s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes up{from{opacity:0;transform:translateY(28px)}}

    .logo { text-align:center; margin-bottom:30px; }
    .logo-badge {
      display:inline-block;
      font-family:'IBM Plex Mono',monospace;
      font-size:9px; letter-spacing:4px; font-weight:600;
      color:var(--red); border:1px solid rgba(255,69,58,.3);
      background:rgba(255,69,58,.07); border-radius:6px;
      padding:4px 14px; margin-bottom:14px;
    }
    .logo h1 {
      font-size:32px; font-weight:900; letter-spacing:-1.5px;
      background:linear-gradient(180deg,#fff 0%,rgba(255,255,255,.6) 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .logo p { font-size:13px; color:var(--dim); margin-top:6px; }

    .box {
      background:rgba(255,255,255,.04);
      border:1px solid var(--stroke);
      border-radius:22px; padding:30px;
      backdrop-filter:blur(20px);
    }
    .field { margin-bottom:18px; }
    .field label {
      display:block; font-size:11px; color:var(--dim);
      font-weight:700; letter-spacing:.6px; margin-bottom:9px;
      text-transform:uppercase;
    }
    .iw {
      display:flex; align-items:center; gap:10px;
      background:rgba(255,255,255,.05);
      border:1.5px solid var(--stroke);
      border-radius:13px; padding:0 14px;
      transition:border-color .2s;
    }
    .iw:focus-within { border-color:var(--blue); }
    .iw i { color:var(--dim); width:16px; height:16px; flex-shrink:0; }
    .iw input {
      flex:1; background:none; border:none; outline:none;
      color:var(--text); font-family:'Tajawal',sans-serif;
      font-size:15px; padding:14px 0;
      direction:ltr; text-align:left;
    }
    .iw input::placeholder { color:var(--dim); }
    .eye {
      background:none; border:none; color:var(--dim);
      cursor:pointer; display:flex; padding:2px;
    }
    .eye:hover { color:var(--text); }
    .eye i { width:16px; height:16px; }

    .btn {
      width:100%; margin-top:8px; padding:15px;
      background:var(--blue); color:#fff; border:none;
      border-radius:13px; font-family:'Tajawal',sans-serif;
      font-size:16px; font-weight:700; cursor:pointer;
      transition:opacity .2s,transform .1s;
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .btn:hover { opacity:.88; }
    .btn:active { transform:scale(.98); }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .btn i { width:17px; height:17px; }

    .err {
      display:none; text-align:center; color:var(--red);
      font-size:13px; margin-top:14px; padding:11px;
      background:rgba(255,69,58,.08); border:1px solid rgba(255,69,58,.2);
      border-radius:10px;
    }
    .err.show { display:block; }

    .foot {
      text-align:center; font-size:11px; color:var(--dim);
      margin-top:22px; font-family:'IBM Plex Mono',monospace;
      letter-spacing:1px;
    }
    .foot a { color:rgba(255,255,255,.25); text-decoration:none; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-badge">ADMIN PANEL</div>
    <h1>AM PRO</h1>
    <p>لوحة تحكم المشرفين — مستقلة</p>
  </div>

  <div class="box">
    <div class="field">
      <label>اسم المستخدم</label>
      <div class="iw">
        <i data-lucide="user"></i>
        <input type="text" id="u" placeholder="admin username" autocomplete="off"/>
      </div>
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <div class="iw">
        <i data-lucide="lock"></i>
        <input type="password" id="p" placeholder="••••••••" autocomplete="off"
               onkeydown="if(event.key==='Enter')go()"/>
        <button class="eye" onclick="toggleEye()" type="button">
          <i id="eyeIcon" data-lucide="eye"></i>
        </button>
      </div>
    </div>
    <button class="btn" id="btn" onclick="go()">
      <i data-lucide="shield-check"></i> دخول
    </button>
    <div class="err" id="err"></div>
  </div>

  <div class="foot">AM PRO Admin v3.0 &nbsp;|&nbsp; <a href="#">Private</a></div>
</div>

<script>
  lucide.createIcons();
  const { createClient } = supabase;
  const sb = createClient(
    "https://tzojjwnqodcrhwjaasja.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6b2pqd25xb2Rjcmh3amFhc2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NzA2ODAsImV4cCI6MjA5MzI0NjY4MH0.G4IGSUgjVIKTNVszU5GpxNaD0VUnSmzUXe8p7uUl418"
  );

  function toggleEye() {
    const inp = document.getElementById('p');
    const ic  = document.getElementById('eyeIcon');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    ic.setAttribute('data-lucide', inp.type === 'password' ? 'eye' : 'eye-off');
    lucide.createIcons();
  }

  async function sha256(msg) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  async function go() {
    const btn  = document.getElementById('btn');
    const err  = document.getElementById('err');
    const user = document.getElementById('u').value.trim();
    const pass = document.getElementById('p').value;
    err.classList.remove('show');

    if (!user || !pass) {
      err.textContent = 'اكتب اسم المستخدم وكلمة المرور';
      err.classList.add('show'); return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i data-lucide="loader-2"></i> جارٍ التحقق...';
    lucide.createIcons();

    const hash = await sha256(pass);
    const { data, error } = await sb
      .from('admins')
      .select('id,username')
      .eq('username', user)
      .eq('password_hash', hash)
      .maybeSingle();

    if (error || !data) {
      err.textContent = 'اسم المستخدم أو كلمة المرور غلط';
      err.classList.add('show');
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="shield-check"></i> دخول';
      lucide.createIcons();
      return;
    }

    sessionStorage.setItem('am_admin_id',   data.id);
    sessionStorage.setItem('am_admin_user', data.username);
    window.location.href = 'dashboard.html';
  }
</script>
</body>
</html>
