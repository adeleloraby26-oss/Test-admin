<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AM PRO — لوحة الأدمن</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <link rel="stylesheet" href="style.css"/>
  <style>
    /* ── MEMBERS GRID TAB ── */
    .tab-bar {
      display:flex; gap:8px; margin-bottom:24px;
      border-bottom:1px solid rgba(255,255,255,.08); padding-bottom:0;
    }
    .tab-btn {
      background:none; border:none; color:var(--dim);
      font-family:'Tajawal',sans-serif; font-size:14px; font-weight:600;
      padding:10px 18px; cursor:pointer; border-bottom:2px solid transparent;
      transition:all .2s; margin-bottom:-1px; display:flex; align-items:center; gap:6px;
    }
    .tab-btn.active { color:var(--blue); border-bottom-color:var(--blue); }
    .tab-btn i { width:15px; height:15px; }

    .tab-panel { display:none; }
    .tab-panel.active { display:block; }

    /* ── PROFILES GRID ── */
    .profiles-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
      gap:16px;
    }
    .profile-card {
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      border-radius:20px; padding:22px 18px;
      display:flex; flex-direction:column; align-items:center;
      gap:10px; cursor:pointer;
      transition:transform .2s, border-color .2s, background .2s;
      text-align:center;
    }
    .profile-card:hover {
      transform:translateY(-3px);
      background:rgba(255,255,255,.07);
      border-color:rgba(255,255,255,.16);
    }
    .profile-avatar {
      width:72px; height:72px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:26px; font-weight:800; flex-shrink:0;
      border:2.5px solid transparent;
      background-clip:padding-box;
      box-shadow:0 0 0 1px rgba(255,255,255,.1);
      overflow:hidden;
      position:relative;
    }
    .profile-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
    .profile-rank-ring {
      position:absolute; inset:-3px; border-radius:50%;
      border:2.5px solid transparent;
    }
    .profile-name { font-size:15px; font-weight:700; color:var(--text); }
    .profile-user { font-size:12px; color:var(--dim); margin-top:-6px; }
    .profile-rank-badge {
      font-size:11px; font-weight:700; padding:3px 12px;
      border-radius:20px; letter-spacing:.3px;
    }
    .profile-field {
      font-size:11px; color:var(--dim);
      background:rgba(255,255,255,.05); border-radius:6px;
      padding:3px 10px;
    }
    .profile-level {
      font-family:'IBM Plex Mono',monospace;
      font-size:12px; color:var(--dim);
    }
    .profile-level span { color:var(--text); font-weight:600; }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-brand">
    <div class="brand-badge">ADMIN</div>
    <span class="nav-title">AM PRO Control</span>
  </div>
  <div class="nav-right">
    <span id="adminName" class="admin-tag">—</span>
    <button class="icon-btn" id="logoutBtn" title="خروج"><i data-lucide="log-out"></i></button>
  </div>
</nav>

<!-- GATE -->
<div id="gate" class="gate">
  <div class="spinner"></div>
  <p>جارٍ التحقق...</p>
</div>

<!-- MAIN -->
<main id="main" class="hidden">

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <i data-lucide="users"></i>
      <div><span id="sMembers">0</span><label>عضو</label></div>
    </div>
    <div class="stat-card">
      <i data-lucide="check-square"></i>
      <div><span id="sTasks">0</span><label>تاسك مكتمل / كل</label></div>
    </div>
    <div class="stat-card">
      <i data-lucide="bar-chart-2"></i>
      <div><span id="sAvg">0</span><label>متوسط المستوى</label></div>
    </div>
    <div class="stat-card">
      <i data-lucide="trophy"></i>
      <div><span id="sMaxRank">—</span><label>أعلى رانك</label></div>
    </div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="search-box">
      <i data-lucide="search"></i>
      <input type="text" id="searchInput" placeholder="ابحث بالاسم أو اليوزر..." oninput="filterMembers()"/>
    </div>
    <button class="btn-primary" onclick="openGlobalTask()">
      <i data-lucide="plus"></i> تاسك جديد
    </button>
  </div>

  <!-- TABS -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('table',this)">
      <i data-lucide="table"></i> جدول الأعضاء
    </button>
    <button class="tab-btn" onclick="switchTab('profiles',this)">
      <i data-lucide="layout-grid"></i> بروفايلات
    </button>
  </div>

  <!-- TABLE TAB -->
  <div class="tab-panel active" id="tab-table">
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>العضو</th>
            <th>المجال</th>
            <th>الجنس</th>
            <th>الرانك</th>
            <th>المستوى</th>
            <th>التاسكات</th>
            <th>تاريخ الانضمام</th>
            <th>إجراءات</th>
          </tr>
        </thead>
        <tbody id="tBody">
          <tr><td colspan="8" class="loading-td"><div class="spinner sm"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- PROFILES TAB -->
  <div class="tab-panel" id="tab-profiles">
    <div class="profiles-grid" id="profilesGrid">
      <!-- rendered by JS -->
    </div>
  </div>

</main>

<!-- ══ MODAL: EDIT MEMBER ══ -->
<div id="editModal" class="overlay hidden">
  <div class="modal">
    <div class="modal-head">
      <div>
        <div id="editBadge" class="rank-pill" style="margin-bottom:6px">—</div>
        <h3 id="editTitle">تعديل العضو</h3>
      </div>
      <button class="icon-btn" onclick="closeModal('editModal')"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId"/>

      <!-- LEVEL -->
      <div class="section-label">المستوى والرانك</div>
      <div class="level-row">
        <button class="lvl-btn" onclick="lvl(-10)">-10</button>
        <button class="lvl-btn" onclick="lvl(-1)">−1</button>
        <div class="level-display">
          <span id="lvlNum">1</span>
          <small>مستوى</small>
        </div>
        <button class="lvl-btn" onclick="lvl(+1)">+1</button>
        <button class="lvl-btn" onclick="lvl(+10)">+10</button>
      </div>
      <div id="rankBar" class="rank-bar">—</div>

      <!-- TASKS -->
      <div class="section-label" style="margin-top:24px">
        التاسكات
        <span id="taskCountBadge" class="count-badge">0</span>
      </div>
      <div id="tasksList" class="tasks-list"></div>
      <div class="add-row">
        <input type="text" id="newTask" placeholder="أضف تاسك جديد..."/>
        <button class="btn-primary sm" onclick="addTask()"><i data-lucide="plus"></i></button>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-ghost" onclick="closeModal('editModal')">إغلاق</button>
      <button class="btn-primary" onclick="saveLevel()"><i data-lucide="save"></i> حفظ المستوى</button>
    </div>
  </div>
</div>

<!-- ══ MODAL: GLOBAL TASK ══ -->
<div id="taskModal" class="overlay hidden">
  <div class="modal" style="max-width:420px">
    <div class="modal-head">
      <h3>إضافة تاسك لعضو</h3>
      <button class="icon-btn" onclick="closeModal('taskModal')"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>اختر العضو</label>
        <select id="taskTarget"></select>
      </div>
      <div class="field" style="margin-top:14px">
        <label>نص التاسك</label>
        <input type="text" id="taskText" placeholder="اكتب التاسك هنا..."/>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-ghost" onclick="closeModal('taskModal')">إلغاء</button>
      <button class="btn-primary" onclick="saveGlobalTask()"><i data-lucide="plus"></i> إضافة</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script src="admin.js"></script>
</body>
</html>
